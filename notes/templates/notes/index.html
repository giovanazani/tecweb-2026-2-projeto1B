{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<div class="appbar">
  <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
  <span class="subtitle">Como o Post-it, mas com outro verbo</span>
  <a class="appbar-link" href="{% url 'tags' %}">Ver tags</a>
</div>

<main class="container">
  <form class="form-card" method="post">
    {% csrf_token %}
    <input class="form-card-title" type="text" name="titulo" placeholder="Título" />
    <textarea class="autoresize" name="detalhes" placeholder="Digite o conteúdo..."></textarea>
    <input class="form-card-title" type="text" name="tag" placeholder="Tag (opcional)" />
    <button class="btn" type="submit">Criar</button>
  </form>

  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <h3 class="card-title">{{ note.title }}</h3>
      <div class="card-content">
        <p>{{ note.content }}</p>
        {% if note.tag %}<p class="card-tag">#{{ note.tag.name }}</p>{% endif %}
      </div>
      <a class="card-action" href="{% url 'edit' note.id %}">Editar</a>
      <a class="card-action" href="{% url 'delete' note.id %}">Apagar</a>
    </div>
    {% endfor %}
  </div>
</main>
{% endblock %}
